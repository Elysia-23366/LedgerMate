<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LedgerMate · 财务智囊</title>
  <style>
    :root { --ink:#091e64; --muted:#8192c2; --line:rgba(92,91,255,.6); --violet:#724aff; --blue:#237eff; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:980px; color:var(--ink); font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif; background:#fff; }
    button,textarea { font:inherit; }
    .app { min-height:100vh; display:flex; overflow:hidden; }
    .sidebar { position:relative; width:256px; flex:0 0 256px; min-height:100vh; padding:35px 12px 28px; border-right:1px solid #dfe5fb; background:linear-gradient(115deg,#fff 2%,#fafbff 75%,#f6f4ff); box-shadow:8px 0 35px rgba(122,161,255,.04); }
    .brand { display:flex; align-items:center; gap:9px; margin:0 12px 32px; color:#071c62; font-weight:750; font-size:25px; letter-spacing:-1.35px; }
    .brand-mark { width:29px; height:31px; flex:0 0 29px; filter:drop-shadow(0 1px 2px rgba(61,124,255,.15)); }
    .new-task { height:61px; width:100%; border:0; border-radius:9px; color:white; cursor:pointer; text-align:left; padding:0 20px; font-size:18px; font-weight:650; background:linear-gradient(105deg,#2f8dff,#7051f8 72%); box-shadow:0 11px 22px rgba(77,89,244,.21); transition:.2s; }
    .new-task:hover { transform:translateY(-2px); box-shadow:0 14px 26px rgba(77,89,244,.3); }
    .new-task span { display:inline-block; font-size:36px; font-weight:200; vertical-align:-4px; margin-right:17px; }
    .nav { margin-top:24px; }
    .nav-item { width:100%; height:57px; padding:0 20px; border:0; display:flex; gap:17px; align-items:center; border-radius:8px; color:#0c236d; background:transparent; font-size:17px; font-weight:650; text-align:left; cursor:pointer; }
    .nav-item:hover { background:#f2f5ff; } .nav-icon { width:23px; height:23px; fill:none; stroke:currentColor; stroke-width:1.8; }
    .section-title { margin:32px 12px 17px; color:#7688bb; font-size:15px; font-weight:650; }
    .empty { margin-top:47px; text-align:center; color:#7789ba; font-size:17px; font-weight:600; }
    .empty svg { display:block; width:36px; height:36px; margin:0 auto 12px; fill:none; stroke:currentColor; stroke-width:1.8; }
    .settings { position:absolute; left:12px; right:12px; bottom:23px; }
    .main { position:relative; flex:1; min-height:100vh; overflow:hidden; background:linear-gradient(136deg,#fff 1%,#fff 39%,#fdfcff 100%); }
    .glow { position:absolute; z-index:0; border-radius:50%; filter:blur(48px); pointer-events:none; opacity:.58; }
    .glow.one { width:690px; height:570px; top:-260px; left:120px; background:#78c4ff; opacity:.42; }
    .glow.two { width:500px; height:475px; top:-185px; right:-30px; background:#8fa3ff; opacity:.5; }
    .glow.three { width:560px; height:300px; bottom:-160px; left:75px; background:#9aa3ff; opacity:.33; }
    .glow.four { width:540px; height:360px; top:340px; right:36px; background:#b9b4ff; opacity:.22; }
    .content { position:relative; z-index:1; width:min(1118px,calc(100% - 90px)); margin:0 auto; padding-top:215px; }
    .hero { text-align:center; position:relative; }
    .sparkle { position:absolute; left:calc(50% - 181px); top:-22px; width:34px; height:34px; filter:drop-shadow(0 0 8px rgba(104,91,255,.36)); }
    h1 { margin:0; color:#071b67; font-size:38px; line-height:1.25; letter-spacing:-1.2px; font-weight:780; }
    .subtitle { margin:13px 0 52px; color:#7a8ec6; font-size:19px; font-weight:600; }
    .workbox { position:relative; min-height:225px; padding:29px 25px 20px; border:2px solid var(--line); border-radius:25px; background:rgba(255,255,255,.88); box-shadow:0 17px 37px rgba(94,99,206,.08); }
    /* 猫与输入框绑定：脚、尾巴压住右上沿，不随标题区域漂移。 */
    /* 人物与阴影是同一个定位组，缩放和移动时不会彼此脱节。 */
    .cat-wrap { position:absolute; z-index:3; right:-12px; top:-270px; width:310px; pointer-events:none; }
    /* 阴影落在输入框上沿：让角色看起来是坐在边沿，而不是悬在半空。 */
    .cat-wrap::after { content:""; position:absolute; z-index:1; top:262px; left:74px; width:198px; height:25px; border-radius:50%; background:rgba(43,53,104,.24); filter:blur(10px); transform:rotate(-7deg); transform-origin:center; pointer-events:none; }
    .cat { position:relative; z-index:2; display:block; width:100%; height:auto; object-fit:contain; }
    /* 不复制角色轮廓做投影，避免腿和尾巴的影子铺进输入框而显得悬浮。 */
    .cat-silhouette-shadow { display:none; }
    textarea { resize:none; display:block; width:100%; height:112px; outline:0; border:0; color:#26356d; background:transparent; font-size:19px; line-height:1.65; }
    textarea::placeholder { color:#8295c8; font-weight:600; }
    .controls { position:absolute; left:25px; right:21px; bottom:15px; display:flex; align-items:center; justify-content:space-between; }
    .circle-btn { width:47px; height:47px; display:grid; place-items:center; cursor:pointer; color:#112b77; background:linear-gradient(#fff,#f9fbff); border:1px solid #dbe2f7; border-radius:13px; box-shadow:0 3px 9px rgba(73,106,177,.05); transition:.2s; }
    .circle-btn:hover { color:#fff; background:var(--blue); transform:translateY(-1px); }
    .circle-btn svg { width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:1.8; }
    .right-controls { display:flex; align-items:center; gap:18px; } .counter { color:#768ac5; font-size:17px; font-weight:600; }
    .send { width:71px; height:53px; border:0; border-radius:14px; display:grid; place-items:center; cursor:pointer; color:#fff; background:linear-gradient(135deg,#198dff,#7850f6 78%); box-shadow:0 7px 15px rgba(75,102,237,.26); transition:.2s; }
    .send:hover { transform:translateY(-2px); filter:saturate(1.2); }.send svg { width:27px; height:27px; fill:none; stroke:currentColor; stroke-width:2.5; }
    .agent-area { height:94px; margin-top:0; display:flex; justify-content:center; align-items:flex-start; gap:13px; padding-top:12px; border-radius:0 0 25px 25px; background:linear-gradient(105deg,rgba(172,219,255,.6),rgba(237,231,255,.78)); }
    .agent { min-width:194px; height:70px; padding:6px 14px 6px 8px; display:flex; align-items:center; gap:10px; border:1px solid #d2def7; border-radius:38px; color:#11266e; background:rgba(255,255,255,.76); box-shadow:0 5px 12px rgba(54,97,160,.06); cursor:pointer; transition:.2s; }
    .agent:hover,.agent.active { transform:translateY(-3px); border-color:#8b67ff; background:#fff; box-shadow:0 10px 21px rgba(85,85,220,.16); }
    .avatar { width:52px; height:52px; flex:0 0 52px; display:grid; place-items:center; overflow:hidden; border-radius:50%; font-size:31px; background:radial-gradient(circle at 35% 20%,#fff,#c9dcff); border:1px solid #dbe4fa; }
    .agent-copy { text-align:left; white-space:nowrap; }.agent-name { font-size:16px; font-weight:750; line-height:1.4; }.agent-role { color:#788abe; font-size:14px; font-weight:600; line-height:1.3; }.agent.active .agent-role { color:#8153f4; }
    .toast { position:fixed; z-index:5; left:50%; bottom:28px; opacity:0; transform:translate(-50%,18px); padding:10px 17px; border-radius:20px; color:#fff; background:#172868; box-shadow:0 8px 25px rgba(15,30,98,.25); transition:.25s; font-size:14px; }.toast.show { opacity:1; transform:translate(-50%,0); }
    @media (max-width:1180px) { .content { width:calc(100% - 55px); }.agent { min-width:0; width:22%; }.cat-wrap { right:-20px; top:-225px; width:260px; }.cat-wrap::after { top:220px; left:61px; width:168px; height:22px; filter:blur(9px); }.sparkle{ left:calc(50% - 150px); } }
    .avatar { position:relative; }
    .avatar img { position:absolute; width:285%; max-width:none; height:auto; left:50%; top:-7%; transform:translateX(-50%); }
    .avatar img[data-person="zhouquan"] { width:300%; top:-12%; }
    .avatar img[data-person="tangnuo"] { width:300%; top:-5%; left:47%; }
    [hidden] { display:none !important; }
    .expert-page { position:relative; z-index:1; height:100vh; min-height:660px; display:flex; flex-direction:column; }
    .expert-header { height:82px; flex-shrink:0; display:flex; align-items:center; gap:13px; padding:0 36px; border-bottom:1px solid #e6eafa; background:rgba(255,255,255,.65); }
    .expert-header .avatar { width:40px; height:40px; flex-basis:40px; font-size:25px; }
    .expert-header strong { font-size:18px; }.expert-header small { margin-left:10px; color:#8192c2; }
    .back-home { margin-left:auto; border:1px solid #dce4fa; background:#fff; color:#7183b5; padding:9px 14px; border-radius:10px; cursor:pointer; }
    .expert-scroll { flex:1; overflow-y:auto; padding:48px 32px 28px; }
    .expert-inner,.expert-composer { width:min(760px,100%); margin:0 auto; }
    .intro-heading { display:flex; align-items:center; gap:14px; margin-bottom:22px; }.intro-heading h2 { font-size:20px; margin:0 0 5px; }.intro-heading span { font-size:13px; color:#8192c2; }
    .intro-text { font-size:16px; line-height:1.9; color:#435681; margin:0 0 14px; }.intro-tagline { color:#724aff; font-weight:600; }
    .example-label { margin:26px 0 12px; font-size:14px; color:#8192c2; }
    .examples { display:grid; gap:10px; }.example { display:flex; justify-content:space-between; gap:16px; width:100%; text-align:left; padding:14px 17px; border:1px solid #e0e6fa; border-radius:12px; color:#405783; background:rgba(255,255,255,.78); cursor:pointer; font-size:14px; line-height:1.6; transition:.18s; }.example:hover { border-color:#a291fa; background:#f8f6ff; transform:translateX(3px); }.example span { color:#9a86ef; }
    .expert-note { font-size:12px; color:#8997b7; line-height:1.8; margin-top:20px; }
    .composer-wrap { flex-shrink:0; padding:16px 32px 22px; background:linear-gradient(0deg,#fafbff 60%,transparent); }.expert-composer { border:1.5px solid #bcaff7; border-radius:20px; padding:18px 20px 13px; background:#fff; box-shadow:0 8px 28px #5360ab0b; }.expert-composer textarea { height:66px; font-size:15px; }.composer-actions { display:flex; align-items:center; gap:12px; margin-top:8px; }.composer-actions .counter { margin-left:auto; font-size:12px; }.composer-actions .send { width:46px; height:40px; border-radius:11px; font-size:24px; }.composer-actions .circle-btn { width:36px; height:36px; font-size:23px; }.messages { display:grid; gap:14px; margin-top:24px; }.message { border-radius:14px; padding:14px 18px; font-size:14px; line-height:1.8; white-space:pre-wrap; overflow-wrap:anywhere; }.message.user { background:#edeaff; margin-left:70px; }.message.assistant { background:#f2f6fd; color:#60739a; margin-right:35px; }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand"><svg class="brand-mark" viewBox="0 0 29 31" aria-hidden="true"><defs><linearGradient id="logoBlue" x1="2" y1="1" x2="25" y2="29" gradientUnits="userSpaceOnUse"><stop stop-color="#9cceff"/><stop offset=".52" stop-color="#528ff9"/><stop offset="1" stop-color="#316bea"/></linearGradient></defs><path d="M9.4 9.8 14.3 5l4.7 4.8-4.7 4.7zM5.2 15.1l4.8-4.7 4.8 4.7-4.8 4.8zM14 20l4.8-4.8 4.8 4.8-4.8 4.8zM9.4 25.2l4.9-4.8 4.7 4.8-4.7 4.8z" fill="url(#logoBlue)"/></svg>LedgerMate</div>
      <button class="new-task" id="newTask"><span>＋</span>新建任务</button>
      <nav class="nav"><button class="nav-item" type="button"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 20v-1a7 7 0 0 0-14 0v1"/><circle cx="12" cy="7" r="4"/><path d="M17 20h3v-1a6 6 0 0 0-3-5.2"/></svg>财务智囊</button></nav>
      <div class="section-title">最近</div><div class="empty"><svg viewBox="0 0 36 36"><path d="M9 8.5h18a4 4 0 0 1 4 4v11a4 4 0 0 1-4 4H17l-6 4v-4H9a4 4 0 0 1-4-4v-11a4 4 0 0 1 4-4Z"/></svg>暂无对话</div>
      <div class="settings"><button class="nav-item" type="button"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.1 2.1-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56v.1h-3v-.1a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-2.1-2.1.06-.06A1.7 1.7 0 0 0 7.06 15a1.7 1.7 0 0 0-1.56-1.03h-.1v-3h.1A1.7 1.7 0 0 0 7.06 9.94a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.1-2.1.06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1.03-1.56v-.1h3v.1a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.1 2.1-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56 1.03h.1v3h-.1A1.7 1.7 0 0 0 19.4 15Z"/></svg>设置与账号</button></div>
    </aside>
    <section class="main"><div class="glow one"></div><div class="glow two"></div><div class="glow three"></div><div class="glow four"></div>
      <div class="content"><div class="hero"><svg class="sparkle" viewBox="0 0 34 34" aria-hidden="true"><defs><linearGradient id="sparkleGradient" x1="4" y1="3" x2="30" y2="31" gradientUnits="userSpaceOnUse"><stop stop-color="#36c2ff"/><stop offset=".54" stop-color="#5a78ff"/><stop offset="1" stop-color="#7a3df5"/></linearGradient></defs><path d="M17 0c1.8 11.4 5.6 15.2 17 17-11.4 1.8-15.2 5.6-17 17-1.8-11.4-5.6-15.2-17-17 11.4-1.8 15.2-5.6 17-17Z" fill="url(#sparkleGradient)"/></svg><h1>今天，有什么财务工作交给我？</h1><p class="subtitle">说说你的需求，让专业伙伴帮你一起完成。</p></div>
        <div class="workbox"><div class="cat-wrap" aria-hidden="true"><img class="cat-silhouette-shadow" src="ledgermate-cat-v2.png" alt="" /><img class="cat" src="ledgermate-cat-v2.png" alt="" /></div><textarea id="prompt" maxlength="2000" placeholder="请描述你的需求，或上传相关文件…"></textarea><div class="controls"><button class="circle-btn" id="attach" aria-label="添加文件"><svg viewBox="0 0 28 28"><path d="M14 5v18M5 14h18"/></svg></button><div class="right-controls"><span class="counter"><b id="count">0</b> / 2000</span><button class="circle-btn" id="voice" aria-label="语音输入"><svg viewBox="0 0 28 28"><rect x="10" y="4" width="8" height="13" rx="4"/><path d="M6.5 14.5a7.5 7.5 0 0 0 15 0M14 22v3M10 25h8"/></svg></button><button class="send" id="send" aria-label="发送任务"><svg viewBox="0 0 30 30"><path d="M15 25V5M7 13l8-8 8 8"/></svg></button></div></div></div>
        <div class="agent-area" aria-label="可选择的财务专家"><button class="agent active" type="button"><span class="avatar">👨🏻‍💼</span><span class="agent-copy"><span class="agent-name">周全</span><br><span class="agent-role">发票识别专家</span></span></button><button class="agent" type="button"><span class="avatar">👩🏻‍💼</span><span class="agent-copy"><span class="agent-name">苏识</span><br><span class="agent-role">财税顾问</span></span></button><button class="agent" type="button"><span class="avatar">👩🏻‍💻</span><span class="agent-copy"><span class="agent-name">林墨</span><br><span class="agent-role">财讯观察员</span></span></button><button class="agent" type="button"><span class="avatar">👨🏻‍💼</span><span class="agent-copy"><span class="agent-name">唐诺</span><br><span class="agent-role">报销审核专家</span></span></button></div>
      </div>
    </section>
  </main><div class="toast" id="toast"></div>
  <script>
    const prompt = document.querySelector('#prompt'), count = document.querySelector('#count'), toast = document.querySelector('#toast');
    const notify = text => { toast.textContent = text; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1900); };
    prompt.addEventListener('input', () => count.textContent = prompt.value.length);
    document.querySelector('#newTask').addEventListener('click', () => { location.hash=''; prompt.value=''; count.textContent='0'; });
    document.querySelector('#attach').addEventListener('click', () => notify('文件上传入口已准备好'));
    document.querySelector('#voice').addEventListener('click', () => notify('语音输入功能待接入'));
    document.querySelector('#send').addEventListener('click', () => { if (!prompt.value.trim()) { prompt.focus(); notify('先说说你想处理什么财务工作吧'); return; } notify('任务已发送给财务智囊'); });
  </script>
  <script>
    const experts = {
      zhouquan:{name:'周全',role:'发票识别专家',avatar:'👨🏻‍💼',tagline:'把繁琐的票据整理，交给细致的我。',intro:'你好，我是周全。你可以把发票图片或 PDF 交给我，我会帮你提取抬头、金额、税额、日期等信息，标出缺失字段和疑似重复的票据，整理成便于复核的清单。确认信息后，再导出 Excel，让每张票据都有据可查。',examples:['整理这批发票，提取关键信息并汇总成 Excel 清单','检查这些发票的抬头、金额和税额，标出需要复核的地方','找出这批票据中疑似重复的发票，并列出判断依据'],placeholder:'描述需要整理的发票，或添加发票图片、PDF…',note:'识别结果需要复核；OCR 识别不等于发票真伪查验，也不代表报销已通过。'},
      sushi:{name:'苏识',role:'财税顾问',avatar:'👩🏻‍💼',tagline:'把财税问题讲清楚，也把依据交给你。',intro:'你好，我是苏识。遇到拿不准的财税问题，可以告诉我业务背景、所属地区和发生时间。我会结合可用的政策原文、会计准则和公司制度，梳理适用条件、处理建议与参考出处；信息不足时，我会先向你确认，让每一步判断都有依据。',examples:['这笔费用应该如何处理？请先告诉我需要补充哪些业务信息','根据我提供的公司制度，解释这项费用的报销要求并标注出处','帮我解读这份税收政策，列出适用条件、生效时间和需要关注的事项'],placeholder:'描述你的财税问题、业务背景和发生时间…',note:'解答供业务参考，实际处理由财务确认；无法确认政策时效或适用条件时，会明确说明。'},
      linmo:{name:'林墨',role:'财讯观察员',avatar:'👩🏻‍💻',tagline:'从纷繁资讯里，找到与你工作有关的变化。',intro:'你好，我是林墨。我帮你整理财税政策与行业动态，从可信来源提取要点，区分发布时间和生效时间，并附上原文出处。你可以指定关注主题，或提供文章与链接，我会整理成便于阅读和复核的财讯简报。',examples:['将我提供的这些财税资讯整理成一份简报，并保留原文链接','梳理这份政策更新的核心变化，区分发布日期和生效日期','对这些新闻去重并按主题分类，标出需要财务进一步关注的内容'],placeholder:'告诉我关注的财讯主题，或提供文章、链接…',note:'资讯与解读会注明来源；简报需人工审核后发布，不自动更新公司的财税知识与审核规则。'},
      tangnuo:{name:'唐诺',role:'报销审核专家',avatar:'👨🏻‍💼',tagline:'先把问题找出来，让报销复核更省心。',intro:'你好，我是唐诺。把报销单、发票和适用的公司制度交给我，我会逐项检查材料是否齐全、金额是否一致、费用是否符合规则，并说明异常对应的依据。遇到缺少材料或规则不明确的情况，我会列出待补充事项，帮助财务更快完成复核。',examples:['根据公司报销制度，预审这份报销单并列出异常及依据','检查报销单与发票的金额是否一致，整理缺失材料清单','把这批报销的检查结果整理为预审报告，区分异常项与待确认项'],placeholder:'描述需要预审的报销事项，或添加报销材料、制度…',note:'预审结果不等于审批通过；不执行付款、记账，缺少规则或必要材料时会提示无法判断。'}
    };
    function setAvatar(container,id){const img=document.createElement('img');img.src='assets/avatars/'+id+'.png';img.alt=experts[id].name;img.dataset.person=id;container.replaceChildren(img);}
    document.querySelectorAll('.agent .avatar').forEach((el,i)=>setAvatar(el,Object.keys(experts)[i]));
    const main=document.querySelector('.main'),home=document.querySelector('.content');
    const expertPage=document.createElement('section'); expertPage.className='expert-page'; expertPage.hidden=true;
    expertPage.innerHTML=`<header class="expert-header"><div class="avatar" id="headerAvatar"></div><div><strong id="headerName"></strong><small id="headerRole"></small></div><button class="back-home" type="button">← 返回首页</button></header><div class="expert-scroll"><div class="expert-inner"><div class="intro-heading"><div class="avatar" id="introAvatar"></div><div><h2 id="introTitle"></h2><span>你的 AI 财务伙伴</span></div></div><p class="intro-text intro-tagline" id="tagline"></p><p class="intro-text" id="introduction"></p><p class="example-label">你可以这样开始</p><div class="examples"></div><p class="expert-note" id="expertNote"></p><div class="messages" aria-live="polite"></div></div></div><div class="composer-wrap"><form class="expert-composer"><textarea id="expertPrompt" maxlength="2000" aria-label="发送给数字员工的需求"></textarea><div class="composer-actions"><button class="circle-btn" id="expertAttach" type="button" aria-label="添加材料">＋</button><span class="counter"><b id="expertCount">0</b> / 2000</span><button class="send" type="submit" aria-label="发送需求">↑</button></div><input type="file" id="expertFiles" hidden multiple accept=".pdf,.png,.jpg,.jpeg,.xlsx,.xls,.csv,.docx,.txt"><p class="expert-note" id="fileNames" hidden></p></form></div>`;
    main.append(expertPage);
    const field=document.querySelector('#expertPrompt');let current=null;const drafts={};
    document.querySelectorAll('.agent').forEach((button,i)=>button.addEventListener('click',()=>{location.hash='/expert/'+Object.keys(experts)[i];}));
    document.querySelector('.back-home').addEventListener('click',()=>location.hash='');
    function renderRoute(){
      if(current) drafts[current]=field.value;
      const id=location.hash.replace('#/expert/','');const e=experts[id];current=e?id:null;
      home.hidden=!!e;expertPage.hidden=!e;document.title=e?`${e.name} · ${e.role} | LedgerMate`:'LedgerMate · 财务智囊';
      if(!e)return;
      for(const [selector,value] of Object.entries({'#headerAvatar':e.avatar,'#introAvatar':e.avatar,'#headerName':e.name,'#headerRole':e.role,'#introTitle':e.role+' · '+e.name,'#tagline':e.tagline,'#introduction':e.intro,'#expertNote':e.note}))document.querySelector(selector).textContent=value;
      setAvatar(document.querySelector('#headerAvatar'),id);setAvatar(document.querySelector('#introAvatar'),id);
      field.placeholder=e.placeholder;field.value=drafts[id]||'';document.querySelector('#expertCount').textContent=field.value.length;
      document.querySelector('.messages').replaceChildren();document.querySelector('#expertFiles').value='';document.querySelector('#fileNames').hidden=true;
      const examples=document.querySelector('.examples');examples.replaceChildren();
      e.examples.forEach(text=>{const b=document.createElement('button');b.className='example';b.type='button';b.append(document.createTextNode(text));const arrow=document.createElement('span');arrow.textContent='↗';b.append(arrow);b.addEventListener('click',()=>{field.value=text;field.dispatchEvent(new Event('input'));field.focus();});examples.append(b);});
      document.querySelector('.expert-scroll').scrollTop=0;
    }
    window.addEventListener('hashchange',renderRoute);renderRoute();
    field.addEventListener('input',()=>document.querySelector('#expertCount').textContent=field.value.length);
    document.querySelector('#expertAttach').addEventListener('click',()=>document.querySelector('#expertFiles').click());
    document.querySelector('#expertFiles').addEventListener('change',event=>{const label=document.querySelector('#fileNames');label.textContent=Array.from(event.target.files).map(f=>f.name).join('、')+'（仅本地选择，尚未上传）';label.hidden=!event.target.files.length;});
    document.querySelector('.expert-composer').addEventListener('submit',event=>{event.preventDefault();if(!field.value.trim()){field.focus();notify('先说说你需要处理什么吧');return;}const messages=document.querySelector('.messages');for(const [cls,text] of [['user',field.value.trim()],['assistant',`这里将由${experts[current].name}处理你的需求。当前为交互演示，尚未接入 AI 服务，材料未上传，也未执行实际分析。`]]){const p=document.createElement('div');p.className='message '+cls;p.textContent=text;messages.append(p);}field.value='';field.dispatchEvent(new Event('input'));const scroll=document.querySelector('.expert-scroll');scroll.scrollTop=scroll.scrollHeight;});
  </script>
</body>
</html>
